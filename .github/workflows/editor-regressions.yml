name: iPhone editor regressions

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-regressions:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check native geometry and real keyboard editing
        id: regression
        run: scripts/run_editor_regressions.sh
      - name: Preserve regression evidence
        if: always() && steps.regression.outputs.evidence_root != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: editor-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.regression.outputs.evidence_root }}
          if-no-files-found: error
          retention-days: 14
