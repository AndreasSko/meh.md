name: Focused native fixture validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focused-native-fixture-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipad:
    name: Focused ipad fixture validation
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run every explicitly selected method
        run: |
          python3 scripts/hosted_subset_fixture_probe.py --platform ipad \
            --identifiers scripts/pad-focused-identifiers.json
      - name: Preserve focused execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: focused-fixture-ipad
          path: ${{ runner.temp }}/focused-fixture-ipad
          if-no-files-found: error
          retention-days: 14
