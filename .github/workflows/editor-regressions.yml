name: Native editor regressions

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-regressions:
    runs-on: xcode-27
    # Stuck-run watchdog; app speed is judged by the performance probes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check native result gates
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_*regression*.py'
          python3 -m unittest discover -s scripts -p 'test_*native_editor_baseline_parity.py'
      - name: Run full native suite against recorded inventory
        id: native_parity
        # Allow broad runner variance
        # and cleanup while retaining a finite watchdog and all result gates.
        timeout-minutes: 45
        run: scripts/run_native_editor_baseline_parity.sh
      - name: Preserve full native result evidence
        if: always() && steps.native_parity.outputs.evidence_root != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-editor-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.native_parity.outputs.evidence_root }}
          if-no-files-found: error
          retention-days: 14
