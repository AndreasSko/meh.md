name: Unchanged baseline isolation comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    name: Unchanged failing methods on fresh iPads
    runs-on: xcode-27
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Record unchanged baseline isolation outcomes
        run: python3 scripts/hosted_baseline_isolation.py
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unchanged-baseline-isolation-ipad
          path: ${{ runner.temp }}/baseline-isolation-ipad
          if-no-files-found: error
          retention-days: 14
