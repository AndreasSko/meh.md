name: Reviewed input and fixture verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/run_native_test_coverage.py
        id: native
      - name: Preserve all native results
        if: always() && steps.native.outputs.evidence_root != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: delta-probe-native
          path: ${{ steps.native.outputs.evidence_root }}
          if-no-files-found: error
  verification:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/hosted_ui_delta_probe.py
        env:
          PROBE_PLATFORM: ipad
      - name: Preserve exact outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: delta-probe-ipad
          path: ${{ runner.temp }}/delta-probe-ipad
          if-no-files-found: error
          retention-days: 14
