name: Failed title accessibility diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: python3 scripts/hosted_wiki_title_ax.py
      - name: Preserve exact failed title evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wiki-title-ax-ipad
          path: ${{ runner.temp }}/wiki-title-ax-ipad
          if-no-files-found: error
          retention-days: 14
