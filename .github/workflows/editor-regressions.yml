name: Native fixture validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-fixture-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    name: Mac fixture validation
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run all applicable Mac UI tests
        run: |
          python3 scripts/run_ui_test_coverage.py --platform macos \
            --output-dir "$RUNNER_TEMP/mac-fixture-probe"
      - name: Preserve Mac execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-fixture-probe
          path: ${{ runner.temp }}/mac-fixture-probe
          if-no-files-found: error
          retention-days: 14
  ordered:
    name: Ordered cross-device fixture validation
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run phone publish, pad reply, original phone reopen
        run: python3 scripts/hosted_ordered_fixture_probe.py
      - name: Preserve focused execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ordered-fixture-probe
          path: ${{ runner.temp }}/ordered-fixture-probe
          if-no-files-found: error
          retention-days: 14
