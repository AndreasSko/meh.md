name: Release notes

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
    paths:
      - .github/workflows/release-notes.yml
      - .github/pull_request_template.md
      - scripts/testflight_notes.py
      - scripts/tests/test_testflight_notes.py

permissions:
  contents: read

concurrency:
  group: release-notes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  notes:
    name: Validate release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test notes collection and publication state
        run: python3 -m unittest discover -s scripts/tests -p 'test_testflight_notes.py' -v
      - name: Validate PR description
        if: github.event_name == 'pull_request'
        run: python3 scripts/testflight_notes.py validate --event "$GITHUB_EVENT_PATH"
