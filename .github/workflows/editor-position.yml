name: iPhone editor position

on:
  pull_request:
    paths:
      - 'meh.md/**'
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'meh.mdUITests/**'
      - 'meh.md.xcodeproj/**'
      - '.github/workflows/editor-position.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-position-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iphone:
    name: Keyboard and scene interruption checks
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create an isolated iPhone simulator
        id: simulator
        shell: bash
        run: |
          runtime=$(xcrun simctl list runtimes available --json | python3 -c '
          import json, sys
          runtimes = [r for r in json.load(sys.stdin)["runtimes"]
                      if r["identifier"].startswith(
                          "com.apple.CoreSimulator.SimRuntime.iOS-")]
          latest = max(runtimes, key=lambda r:
                       tuple(map(int, r["version"].split("."))))
          print(latest["identifier"])
          ')
          device=$(xcrun simctl create "meh editor $GITHUB_RUN_ID" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro "$runtime")
          echo "id=$device" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
      - name: Test iCloud Dev editor position
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test -project meh.md.xcodeproj \
            -scheme 'meh.md iCloud Dev' \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath "$RUNNER_TEMP/editor-position-build" \
            -resultBundlePath "$RUNNER_TEMP/editor-position.xcresult" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -only-testing:meh.mdUITests/EditorKeyboardUITests/testKeyboardViewportSurvivesBackgroundReturn \
            -only-testing:meh.mdUITests/EditorKeyboardUITests/testMiddleTypingViewportSurvivesBackgroundReturn \
            -only-testing:meh.mdUITests/EditorKeyboardUITests/testTypingViewportSurvivesBackgroundReturn \
            -only-testing:meh.mdUITests/EditorKeyboardUITests/testTypingViewportSurvivesShortHomeGesture \
            -only-testing:meh.mdUITests/EditorKeyboardUITests/testOrdinaryScrollRetainsKeyboardAndDragDismissesIt \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/editor-position.log"
      - name: Upload simulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-position-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/editor-position.log
            ${{ runner.temp }}/editor-position.xcresult
          if-no-files-found: warn
          retention-days: 10
      - name: Remove the isolated simulator
        if: always() && steps.simulator.outputs.id != ''
        shell: bash
        run: |
          xcrun simctl shutdown '${{ steps.simulator.outputs.id }}' || true
          xcrun simctl delete '${{ steps.simulator.outputs.id }}'
