name: Internal TestFlight

on:
  pull_request:
  push:
    branches: [main]
    # Every merge that can change the app becomes a build.
    # Keep in sync with scripts/app_changed.sh
    paths-ignore: ['docs/**', '**/*.md', 'Tools/AppStore/**', '.claude/**',
      '.github/workflows/release.yml', '.github/workflows/beta.yml',
      '.github/workflows/release-notes.yml', '.github/workflows/app-store.yml',
      'scripts/release_notes.py', 'scripts/test_release_notes.py',
      'scripts/testflight_builds.sh']
  workflow_dispatch:

permissions:
  contents: read

# Uploads already accepted by Apple cannot be undone by cancellation.
concurrency:
  group: internal-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.ref != 'refs/heads/main'
    name: Release scripts and app changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.app.outputs.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # A PR checks out its merge commit, whose first parent is the base.
          fetch-depth: 2
      - name: Check release scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts -p 'test_release*.py'
      - name: Find app changes
        id: app
        env:
          PR: ${{ github.event_name == 'pull_request' }}
          # A stacked PR's first parent is the layer below, not main.
          STACKED: ${{ github.event.pull_request.stack != null }}
        run: |
          app=true
          [[ $PR == true && $STACKED != true ]] && app=$(scripts/app_changed.sh HEAD^1 HEAD)
          echo "app=$app" >> "$GITHUB_OUTPUT"

  build:
    # On main the signed archives in publish compile the same code, so
    # the unsigned builds only run where nothing is published. A skipped
    # job counts as passed, so a PR that can't change the app isn't held up.
    needs: changes
    if: >-
      !cancelled() && github.ref != 'refs/heads/main'
      && needs.changes.outputs.app != 'false'
      && (github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size)
    # One runner builds both platforms, which keeps a macOS runner free
    # for the UI lanes.
    name: Release builds
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      # Release builds is the required check, so it fails for them.
      - name: Check release scripts and app changes passed
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: rudrankriyam/setup-asc@5358c70a27a3f0d1517604b0f1fdc43e70c1cc4d
        with:
          version: 5.3.4
      - name: Check toolchain and export settings
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | grep -Eq '^Xcode 27([. ]|$)'
          asc --version
          plutil -lint .github/testflight/*.plist
      - name: Build iOS Release without signing
        run: |
          xcodebuild -project meh.md.xcodeproj -scheme meh.md \
            -configuration Release -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/build" -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build Mac Release without signing
        if: ${{ !cancelled() }}
        run: |
          xcodebuild -project meh.md.xcodeproj -scheme meh.md \
            -configuration Release -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/build" -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build

  validate:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: scripts/run_notebook_sync_validation.sh

  # One runner archives both platforms. The iOS build uploads and waits
  # for Apple processing in the background while the Mac archive builds.
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    environment: testflight
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: read
      # Finds the merged PR for the test notes.
      pull-requests: read
      # Records each build on its commit, for beta.yml and release.yml.
      statuses: write
    env:
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      ASC_BYPASS_KEYCHAIN: '1'
      ASC_NO_UPDATE: '1'
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      GROUP_ID: ${{ vars.TESTFLIGHT_INTERNAL_GROUP_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The version comes from the release tags.
          fetch-depth: 0
      - name: Pick version and test notes
        run: |
          version=$(scripts/app_version.sh)
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          notes=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            | jq -r '.[0].body // ""' | scripts/release_notes.py paragraph \
            | scripts/release_notes.py plain)
          {
            echo 'TEST_NOTES<<END_OF_NOTES'
            printf '%s\n\nCommit %s\n' "${notes:-Automatic build from main.}" "$GITHUB_SHA"
            echo 'END_OF_NOTES'
          } >> "$GITHUB_ENV"
          echo "Version $version" >> "$GITHUB_STEP_SUMMARY"
      - uses: rudrankriyam/setup-asc@5358c70a27a3f0d1517604b0f1fdc43e70c1cc4d
        with:
          version: 5.3.4
      - name: Check toolchain and internal audience
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | grep -Eq '^Xcode 27([. ]|$)'
          asc testflight groups list --app "$ASC_APP_ID" --internal \
            --paginate --output json | jq -e --arg id "$GROUP_ID" \
            'any(.data[]; .id == $id and .attributes.isInternalGroup == true)'
      - name: Import signing identities
        id: identities
        uses: apple-actions/import-codesign-certs@a533c09a88c7f2d5f26c2cb7925ba7a4b92173c8
        with:
          p12-file-base64: ${{ secrets.SIGNING_CERTIFICATES_P12_BASE64 }}
          p12-password: ${{ secrets.SIGNING_CERTIFICATES_PASSWORD }}
      - name: Install iOS profiles
        env:
          APP_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          WIDGETS_PROFILE_BASE64: ${{ secrets.IOS_WIDGETS_PROFILE_BASE64 }}
          PROFILE_EXTENSION: mobileprovision
        run: &profiles |
          umask 077
          directory="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$directory"
          for name in APP WIDGETS; do
            variable="${name}_PROFILE_BASE64"
            [[ -n "${!variable}" ]] || { echo "Missing secret for $name profile" >&2; exit 1; }
            printf '%s' "${!variable}" | base64 --decode > "$RUNNER_TEMP/profile"
            security cms -D -i "$RUNNER_TEMP/profile" > "$RUNNER_TEMP/profile.plist"
            uuid=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
            cp "$RUNNER_TEMP/profile" "$directory/$uuid.$PROFILE_EXTENSION"
          done
      - name: Archive iOS
        id: ios_archive
        env:
          PLATFORM: IOS
          DESTINATION: generic/platform=iOS
          APP_PROFILE: meh.md iOS TestFlight
          WIDGETS_PROFILE: meh.md Widgets iOS TestFlight
        run: &archive |
          number=$(asc builds next-build-number --app "$ASC_APP_ID" \
            --platform "$PLATFORM" --output json | jq -er '.nextBuildNumber')
          [[ "$number" =~ ^[1-9][0-9]*$ ]]
          echo "number=$number" >> "$GITHUB_OUTPUT"
          xcodebuild -project meh.md.xcodeproj -scheme meh.md \
            -configuration Release -destination "$DESTINATION" \
            -archivePath "$RUNNER_TEMP/$PLATFORM.xcarchive" -skipPackagePluginValidation \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MEH_APP_PROFILE="$APP_PROFILE" \
            MEH_WIDGETS_PROFILE="$WIDGETS_PROFILE" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$number" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/$PLATFORM.xcarchive" \
            -exportPath "$RUNNER_TEMP/$PLATFORM" \
            -exportOptionsPlist ".github/testflight/$PLATFORM.plist"
      - name: Publish iOS to internal testers
        background: true
        env:
          PLATFORM: IOS
          ARTIFACT: ipa
          BUILD_NUMBER: ${{ steps.ios_archive.outputs.number }}
        run: &publish |
          files=("$RUNNER_TEMP/$PLATFORM/"*."$ARTIFACT")
          [[ ${#files[@]} == 1 && -f "${files[0]}" ]]
          version=$(plutil -extract ApplicationProperties.CFBundleShortVersionString \
            raw "$RUNNER_TEMP/$PLATFORM.xcarchive/Info.plist")
          asc publish testflight --app "$ASC_APP_ID" \
            "--$ARTIFACT" "${files[0]}" --platform "$PLATFORM" \
            --version "$version" --build-number "$BUILD_NUMBER" \
            --group "$GROUP_ID" --wait --timeout 30m \
            --test-notes "$TEST_NOTES" \
            --locale en-US --output json > "$RUNNER_TEMP/$PLATFORM-publish.json"
          build_id=$(jq -er '.buildId' "$RUNNER_TEMP/$PLATFORM-publish.json")
          asc testflight groups list --build-id "$build_id" --output json \
            | jq -e --arg id "$GROUP_ID" \
                '.complete == true and any(.groups[]; .id == $id and .type == "internal")'
          printf '### %s %s (%s)\n\nCommit: `%s`\n\nProcessed and assigned to the internal group. Build ID: `%s`\n' \
            "$PLATFORM" "$version" "$BUILD_NUMBER" "$GITHUB_SHA" "$build_id" \
            >> "$GITHUB_STEP_SUMMARY"
          jq -n --arg context "testflight/$PLATFORM" \
            --arg description "$version ($BUILD_NUMBER)" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: "success", context: $context, description: $description, target_url: $url}' \
            | curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" --data @- \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" > /dev/null
      # A failed iOS step does not stop the Mac build.
      - name: Install Mac profiles
        id: mac_profiles
        if: ${{ !cancelled() && steps.identities.outcome == 'success' }}
        env:
          APP_PROFILE_BASE64: ${{ secrets.MACOS_PROFILE_BASE64 }}
          WIDGETS_PROFILE_BASE64: ${{ secrets.MACOS_WIDGETS_PROFILE_BASE64 }}
          PROFILE_EXTENSION: provisionprofile
        run: *profiles
      - name: Archive Mac
        id: mac_archive
        if: ${{ !cancelled() && steps.mac_profiles.outcome == 'success' }}
        env:
          PLATFORM: MAC_OS
          DESTINATION: generic/platform=macOS
          APP_PROFILE: meh.md Mac TestFlight
          WIDGETS_PROFILE: meh.md Widgets Mac TestFlight
        run: *archive
      - name: Publish Mac to internal testers
        if: ${{ !cancelled() && steps.mac_archive.outcome == 'success' }}
        env:
          PLATFORM: MAC_OS
          ARTIFACT: pkg
          BUILD_NUMBER: ${{ steps.mac_archive.outputs.number }}
        run: *publish
      - name: Wait for iOS publishing
        wait-all:
