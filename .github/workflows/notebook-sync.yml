name: Notebook sync validation

on:
  pull_request:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:
    inputs:
      scheduled_scale:
        description: Run the larger seeded and scale matrix
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: notebook-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: App changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.app.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # A PR checks out its merge commit, whose first parent is the base.
          fetch-depth: 2
      - name: Find app changes
        id: app
        env:
          PR: ${{ github.event_name == 'pull_request' }}
          # A stacked PR's first parent is the layer below, not main.
          STACKED: ${{ github.event.pull_request.stack != null }}
        run: |
          app=true
          [[ $PR == true && $STACKED != true ]] && app=$(scripts/app_changed.sh HEAD^1 HEAD)
          echo "app=$app" >> "$GITHUB_OUTPUT"

  sync:
    # A skipped job counts as passed, so a PR that can't change the app
    # isn't held up by this required check.
    needs: changes
    # In a stack only the top PR runs this; it holds every layer.
    if: >-
      !cancelled() && needs.changes.outputs.app != 'false'
      && (github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size)
    name: Deterministic replica and loopback checks
    runs-on: xcode-27
    timeout-minutes: >-
      ${{ (github.event_name == 'schedule' || inputs.scheduled_scale == true)
          && 60 || 30 }}
    steps:
      # This is the required check, so it fails when the change check did.
      - name: Check app changes passed
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record hosted toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Run validation
        id: validation
        env:
          SCHEDULED_SCALE: >-
            ${{ github.event_name == 'schedule' ||
                inputs.scheduled_scale == true }}
        run: |
          if [[ "$SCHEDULED_SCALE" == "true" ]]; then
            scripts/run_notebook_sync_validation.sh --scheduled
          else
            scripts/run_notebook_sync_validation.sh
          fi
      - name: Upload validation logs
        if: always() && steps.validation.outputs.evidence_root != ''
        uses: actions/upload-artifact@v4
        with:
          name: notebook-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.validation.outputs.evidence_root }}/*.log
          if-no-files-found: warn
          retention-days: 14
