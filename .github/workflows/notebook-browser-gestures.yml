name: Notebook browser gestures

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook-browser-gestures:
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, iPhone, iPad]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exercise native notebook drags and retain recordings
        id: gestures
        run: scripts/run_notebook_browser_gestures.sh '${{ matrix.platform }}'
      - name: Require verified evidence for this source head
        env:
          VERIFIED_HEAD: ${{ steps.gestures.outputs.verified_head }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test -n "$VERIFIED_HEAD"
          test "$VERIFIED_HEAD" = "$EXPECTED_HEAD"
      - name: Preserve gesture evidence
        if: always() && steps.gestures.outputs.evidence_root != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notebook-gestures-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.gestures.outputs.evidence_root }}
          if-no-files-found: error
          retention-days: 14
