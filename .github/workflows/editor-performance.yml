name: Editor regressions and performance

on:
  pull_request:
  # A full timed run of every step on main, in case a PR skipped one it
  # should not have.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: Run an unscored frozen-reference CPU trace on a fresh runner
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: editor-performance-${{ github.ref }}-${{ inputs.diagnostic_only && 'diagnostic' || 'guard' }}
  cancel-in-progress: true

env:
  # The image defaults to Xcode 27.1, whose AppIntentsTesting can't load on
  # the iOS 27.2 simulators the UI tests use. Build and test with 27.2.
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  select:
    name: Select editor performance steps
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnostic_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Reads the nightly coverage index from editor-coverage.yml's artifact.
      actions: read
    outputs:
      steps: ${{ steps.select.outputs.steps }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The diff starts at the coverage index's commit or the merge base.
          fetch-depth: 0
      - name: Check the selection
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts -p 'test_select_editor_steps.py'
      - name: Pick steps from the diff and coverage
        id: select
        env:
          # A stacked PR compares against the stack's base, so the top PR
          # picks steps for every layer.
          BASE: ${{ github.event.pull_request.stack.base.sha || github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$BASE" ]; then
            python3 scripts/select_editor_steps.py --github-output --base "$BASE"
          else
            python3 scripts/select_editor_steps.py --github-output --all
          fi

  # Regressions and performance share one runner, which keeps a macOS
  # runner free for the UI lanes. Together they still finish before the
  # iPhone UI lane.
  editor:
    name: Editor regressions and performance
    needs: select
    # In a stack only the top PR runs this; it holds every layer.
    if: needs.select.outputs.any == 'true' && (github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size)
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check native result gates
        run: python3 -m unittest discover -s scripts -p 'test_*native_editor_baseline_parity.py'
      - name: Run Mac editor tests and drawing checks
        id: mac_editor
        if: fromJSON(needs.select.outputs.steps).formatting
        env:
          EDITOR_RENDERING_ARTIFACTS: ${{ runner.temp }}/editor-rendering
        run: |
          mkdir -p "$EDITOR_RENDERING_ARTIFACTS"
          swift test --filter 'EditorMacFormattingScrollTests|EditorRenderingTests|NativeEditorIntegrationTests'
      - name: Preserve Mac editor drawings that failed
        if: failure() && steps.mac_editor.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: editor-rendering-mac-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/editor-rendering
          if-no-files-found: ignore
          retention-days: 14
      - name: Run full native suite against recorded inventory
        id: native_parity
        if: fromJSON(needs.select.outputs.steps).native
        # Allow broad runner variance
        # and cleanup while retaining a finite watchdog and all result gates.
        timeout-minutes: 45
        run: scripts/run_native_editor_baseline_parity.sh
      - name: Preserve full native result evidence
        if: always() && steps.native_parity.outputs.evidence_root != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-editor-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.native_parity.outputs.evidence_root }}
          if-no-files-found: error
          retention-days: 14
      - name: Check report gate
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s scripts -p 'test_*performance*.py'
      - name: Guard large-document History in Swift
        if: ${{ !cancelled() && fromJSON(needs.select.outputs.steps).history }}
        env:
          MEH_HISTORY_BENCHMARK_EDITS: "600"
          MEH_HISTORY_BENCHMARK_LINES: "1800"
          MEH_HISTORY_INDEX_BUDGET_SECONDS: "30"
          MEH_HISTORY_INDEX_REGRESSION_FACTOR: "2"
          MEH_HISTORY_FIRST_READY_BUDGET_SECONDS: "2"
          MEH_HISTORY_REOPEN_BUDGET_SECONDS: "0.25"
          MEH_HISTORY_PREVIEW_BUDGET_SECONDS: "0.5"
        run: |
          set -euo pipefail
          swift test -c release \
            --filter 'NoteHistory(Tests|ReaderTests|PerformanceTests)' \
            2>&1 | tee "$RUNNER_TEMP/history-performance.log"
      - name: Guard 500 KB History in Swift
        if: ${{ !cancelled() && fromJSON(needs.select.outputs.steps).history }}
        env:
          MEH_HISTORY_BENCHMARK_EDITS: "600"
          MEH_HISTORY_BENCHMARK_LINES: "7460"
          MEH_HISTORY_INDEX_BUDGET_SECONDS: "90"
          MEH_HISTORY_INDEX_REGRESSION_FACTOR: "2"
          MEH_HISTORY_FIRST_READY_BUDGET_SECONDS: "6"
          MEH_HISTORY_REOPEN_BUDGET_SECONDS: "0.25"
          MEH_HISTORY_PREVIEW_BUDGET_SECONDS: "0.5"
        run: |
          set -euo pipefail
          swift test -c release --filter NoteHistoryPerformanceTests \
            2>&1 | tee "$RUNNER_TEMP/history-performance-500kb.log"
      - name: Guard catalog responsiveness
        if: ${{ !cancelled() && fromJSON(needs.select.outputs.steps).catalog }}
        shell: bash
        run: |
          set -euo pipefail
          MEH_CATALOG_BENCHMARK=1 \
            MEH_CATALOG_BENCHMARK_REPORT="$RUNNER_TEMP/catalog-performance.json" \
            swift test -c release --filter NotebookCatalogPerformanceTests \
            2>&1 | tee "$RUNNER_TEMP/catalog-performance.log"
          python3 scripts/check_catalog_performance.py "$RUNNER_TEMP/catalog-performance.json"
      - name: Guard Unicode initial parsing
        if: ${{ !cancelled() && fromJSON(needs.select.outputs.steps).parser }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/run_parser_performance_ci.sh
      - name: Run native editor probes
        if: ${{ !cancelled() && fromJSON(needs.select.outputs.steps).probes }}
        id: probe
        run: scripts/run_editor_performance_ci.sh
      - name: Preserve performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: editor-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.probe.outputs.evidence_root }}
            ${{ runner.temp }}/catalog-performance.json
            ${{ runner.temp }}/catalog-performance.log
            ${{ runner.temp }}/parser-current-*
            ${{ runner.temp }}/parser-recorded-reference.json
            ${{ runner.temp }}/history-performance.log
            ${{ runner.temp }}/history-performance-500kb.log
          if-no-files-found: warn
          retention-days: 30

  editor-performance-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_only }}
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record unscored frozen-reference CPU trace
        id: diagnostic
        run: scripts/run_editor_performance_fresh_diagnostic.sh
      - name: Preserve raw diagnostic evidence
        if: always() && steps.diagnostic.outputs.evidence_root != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: editor-performance-fresh-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.diagnostic.outputs.evidence_root }}
          if-no-files-found: error
          retention-days: 30
