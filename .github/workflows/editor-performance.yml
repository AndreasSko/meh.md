name: Editor performance guard

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-performance:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check report gate
        run: python3 -m unittest discover -s scripts -p 'test_*performance*.py'
      - name: Guard large-document History in Swift
        env:
          MEH_HISTORY_BENCHMARK_EDITS: "600"
          MEH_HISTORY_BENCHMARK_LINES: "1800"
          MEH_HISTORY_INDEX_BUDGET_SECONDS: "20"
          MEH_HISTORY_INDEX_REGRESSION_FACTOR: "1.35"
          MEH_HISTORY_FIRST_READY_BUDGET_SECONDS: "1"
          MEH_HISTORY_REOPEN_BUDGET_SECONDS: "0.05"
          MEH_HISTORY_PREVIEW_BUDGET_SECONDS: "0.25"
        run: |
          set -euo pipefail
          swift test -c release \
            --filter 'NoteHistory(Tests|ReaderTests|PerformanceTests)' \
            2>&1 | tee "$RUNNER_TEMP/history-performance.log"
      - name: Guard 500 KB History in Swift
        env:
          MEH_HISTORY_BENCHMARK_EDITS: "600"
          MEH_HISTORY_BENCHMARK_LINES: "7460"
          MEH_HISTORY_INDEX_BUDGET_SECONDS: "60"
          MEH_HISTORY_INDEX_REGRESSION_FACTOR: "1.35"
          MEH_HISTORY_FIRST_READY_BUDGET_SECONDS: "3"
          MEH_HISTORY_REOPEN_BUDGET_SECONDS: "0.05"
          MEH_HISTORY_PREVIEW_BUDGET_SECONDS: "0.25"
        run: |
          set -euo pipefail
          swift test -c release --filter NoteHistoryPerformanceTests \
            2>&1 | tee "$RUNNER_TEMP/history-performance-500kb.log"
      - name: Check baseline catalog and parser on this runner
        shell: bash
        run: |
          set -euo pipefail
          baseline_root=$(mktemp -d "$RUNNER_TEMP/editor-baseline.XXXXXX")
          git worktree add --detach "$baseline_root" 1378bf5e1b9fcaf0ff5e97435a320ef7d726ef42
          printf 'EDITOR_PERFORMANCE_BASELINE_ROOT=%s\n' "$baseline_root" >> "$GITHUB_ENV"
          cp Tests/NoteCoreTests/NotebookCatalogPerformanceTests.swift \
            "$baseline_root/Tests/NoteCoreTests/NotebookCatalogPerformanceTests.swift"
          cp Tests/NativeEditorTests/MarkdownFullParsePerformanceTests.swift \
            "$baseline_root/Tests/NativeEditorTests/MarkdownFullParsePerformanceTests.swift"
          mkdir -p "$baseline_root/Tools/EditorQuoteCheck" "$baseline_root/scripts"
          cp -R Tools/EditorQuoteCheck/. "$baseline_root/Tools/EditorQuoteCheck/"
          cp scripts/run_editor_performance_check.sh scripts/run_editor_performance_ci.sh \
            scripts/editor_performance_app_cache.py \
            "$baseline_root/scripts/"
          (
            cd "$baseline_root"
            MEH_CATALOG_BENCHMARK=1 \
              MEH_CATALOG_BENCHMARK_REPORT="$RUNNER_TEMP/catalog-baseline.json" \
              MEH_FULL_PARSE_BENCHMARK=1 MEH_FULL_PARSE_LABEL=ci-baseline-release \
              MEH_FULL_PARSE_REPORT="$RUNNER_TEMP/parser-baseline.json" \
              swift test -c release --filter \
                'NotebookCatalogPerformanceTests/testCatalogStartupAndRecentActivityBenchmark|MarkdownFullParsePerformanceTests/testOptInFullParseTiming'
          ) 2>&1 | tee "$RUNNER_TEMP/catalog-parser-baseline.log"
          PYTHONPATH=scripts python3 - "$RUNNER_TEMP/catalog-baseline.json" <<'PY'
          import json
          import sys
          from check_catalog_performance import HEARTBEAT_METRICS, check_report
          with open(sys.argv[1], encoding="utf-8") as source:
              errors = check_report(json.load(source))
          heartbeat_failed = any(
              error.startswith(metric + " ")
              for error in errors for metric in HEARTBEAT_METRICS
          )
          if not heartbeat_failed or any("budget is" not in error for error in errors):
              sys.exit(f"Baseline must fail a valid heartbeat budget: {errors}")
          print("Known baseline rejected:", *errors, sep="\n")
          PY
      - name: Measure known-good parser reference on this runner
        shell: bash
        run: |
          set -euo pipefail
          reference_root=$(mktemp -d "$RUNNER_TEMP/editor-reference.XXXXXX")
          git worktree add --detach "$reference_root" 0dcaea9eeef6d635604c4d8570c9a2af983b0d73
          printf 'EDITOR_PERFORMANCE_REFERENCE_ROOT=%s\n' "$reference_root" >> "$GITHUB_ENV"
          cp Tests/NativeEditorTests/MarkdownFullParsePerformanceTests.swift \
            "$reference_root/Tests/NativeEditorTests/MarkdownFullParsePerformanceTests.swift"
          mkdir -p "$reference_root/Tools/EditorQuoteCheck" "$reference_root/scripts"
          cp -R Tools/EditorQuoteCheck/. "$reference_root/Tools/EditorQuoteCheck/"
          cp scripts/run_editor_performance_check.sh scripts/run_editor_performance_ci.sh \
            scripts/editor_performance_app_cache.py "$reference_root/scripts/"
          (
            cd "$reference_root"
            MEH_FULL_PARSE_BENCHMARK=1 MEH_FULL_PARSE_LABEL=ci-reference-release \
              MEH_FULL_PARSE_REPORT="$RUNNER_TEMP/parser-reference.json" \
              swift test -c release --filter \
                'MarkdownFullParsePerformanceTests/testOptInFullParseTiming'
          ) 2>&1 | tee "$RUNNER_TEMP/parser-reference.log"
      - name: Guard catalog responsiveness
        shell: bash
        run: |
          set -euo pipefail
          MEH_CATALOG_BENCHMARK=1 \
            MEH_CATALOG_BENCHMARK_REPORT="$RUNNER_TEMP/catalog-performance.json" \
            swift test -c release --filter NotebookCatalogPerformanceTests \
            2>&1 | tee "$RUNNER_TEMP/catalog-performance.log"
          python3 scripts/check_catalog_performance.py "$RUNNER_TEMP/catalog-performance.json"
      - name: Guard Unicode initial parsing
        shell: bash
        run: |
          set -euo pipefail
          MEH_FULL_PARSE_BENCHMARK=1 MEH_FULL_PARSE_LABEL=ci-release \
            MEH_FULL_PARSE_REPORT="$RUNNER_TEMP/parser-performance.json" \
            swift test -c release --filter MarkdownFullParsePerformanceTests \
            2>&1 | tee "$RUNNER_TEMP/parser-performance.log"
          python3 scripts/check_parser_performance.py "$RUNNER_TEMP/parser-performance.json" \
            --baseline-report "$RUNNER_TEMP/parser-baseline.json" \
            --reference-report "$RUNNER_TEMP/parser-reference.json"
      - name: Run native editor probes
        id: probe
        run: scripts/run_editor_performance_ci.sh
      - name: Remove owned baseline worktree
        if: always()
        shell: bash
        run: |
          if [[ -n "${EDITOR_PERFORMANCE_BASELINE_ROOT:-}" ]]; then
            case "$EDITOR_PERFORMANCE_BASELINE_ROOT" in
              "$RUNNER_TEMP"/editor-baseline.*)
                git worktree remove --force "$EDITOR_PERFORMANCE_BASELINE_ROOT"
                ;;
              *) echo "Refusing unexpected baseline worktree path" >&2; exit 1 ;;
            esac
          fi
      - name: Remove owned reference worktree
        if: always()
        shell: bash
        run: |
          if [[ -n "${EDITOR_PERFORMANCE_REFERENCE_ROOT:-}" ]]; then
            case "$EDITOR_PERFORMANCE_REFERENCE_ROOT" in
              "$RUNNER_TEMP"/editor-reference.*)
                git worktree remove --force "$EDITOR_PERFORMANCE_REFERENCE_ROOT"
                ;;
              *) echo "Refusing unexpected reference worktree path" >&2; exit 1 ;;
            esac
          fi
      - name: Preserve performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: editor-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.probe.outputs.evidence_root }}
            ${{ runner.temp }}/catalog-performance.json
            ${{ runner.temp }}/catalog-performance.log
            ${{ runner.temp }}/catalog-baseline.json
            ${{ runner.temp }}/catalog-parser-baseline.log
            ${{ runner.temp }}/parser-baseline.json
            ${{ runner.temp }}/parser-reference.json
            ${{ runner.temp }}/parser-reference.log
            ${{ runner.temp }}/parser-performance.json
            ${{ runner.temp }}/parser-performance.log
            ${{ runner.temp }}/history-performance.log
            ${{ runner.temp }}/history-performance-500kb.log
          if-no-files-found: warn
          retention-days: 30
