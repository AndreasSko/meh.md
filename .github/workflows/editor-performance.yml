name: Editor performance guard

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-performance:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check report gate
        run: python3 -m unittest discover -s scripts -p 'test_check_editor_performance.py'
      - name: Run native editor probes
        id: probe
        run: scripts/run_editor_performance_ci.sh
      - name: Preserve performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: editor-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.probe.outputs.evidence_root }}
          if-no-files-found: warn
          retention-days: 30
